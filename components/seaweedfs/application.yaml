apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: seaweedfs
  namespace: argocd
  annotations:
    # Its S3 credentials come from the secret store.
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: seaweedfs
  sources:
    - repoURL: https://seaweedfs.github.io/seaweedfs/helm
      chart: seaweedfs
      targetRevision: 4.54.0
      helm:
        valueFiles:
          - $values/clusters/{{ .Values.cluster }}/values/seaweedfs.yaml
        ignoreMissingValueFiles: true
    - repoURL: {{ .Values.repoURL }}
      targetRevision: {{ .Values.revision }}
      path: components/seaweedfs/manifests
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
