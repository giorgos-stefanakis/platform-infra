apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-issuer
  namespace: argocd
  annotations:
    # Needs the cert-manager CRDs (wave 0) and the Key Vault secret store (wave 2).
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
  source:
    repoURL: https://github.com/giorgos-stefanakis/platform-infra.git
    targetRevision: main
    path: clusters/aks/client/cluster-issuer
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
