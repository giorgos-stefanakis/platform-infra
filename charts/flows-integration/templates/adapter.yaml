{{- $ns := printf "int-%s" .Values.name }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.name }}
  namespace: {{ $ns }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name }}
  namespace: {{ $ns }}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: {{ .Values.name }}}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.name }}
        app.kubernetes.io/part-of: flows-integrations
    spec:
      serviceAccountName: {{ .Values.name }}
      automountServiceAccountToken: false
      enableServiceLinks: false
      {{- with .Values.platform.imagePullSecretKey }}
      imagePullSecrets:
        - name: registry-pull
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: adapter
          image: {{ required "image is required" .Values.image }}
          ports: [{name: http, containerPort: 8080}]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          resources:
            {{- toYaml .Values.platform.resources | nindent 12 }}
          volumeMounts:
            - {name: secrets, mountPath: /var/run/secrets/integration, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: secrets
          secret:
            secretName: {{ .Values.name }}-secrets
            defaultMode: 0440
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  namespace: {{ $ns }}
spec:
  selector: {app.kubernetes.io/name: {{ .Values.name }}}
  ports: [{name: http, port: 8080, targetPort: http}]
---
# The connection in Flows is anonymous HTTP; this policy is what authorizes the caller.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.name }}
  namespace: {{ $ns }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Values.platform.flows.namespace }}}
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: {{ toJson .Values.platform.flows.callers }}
      ports: [{port: 8080}]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports: [{port: 53, protocol: UDP}, {port: 53, protocol: TCP}]
    {{- range .Values.egress }}
    - to:
        {{- if .toNamespace }}
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .toNamespace }}}
        {{- else }}
        - ipBlock: {cidr: {{ .cidr }}}
        {{- end }}
      ports: [{port: {{ .port }}}]
    {{- end }}
