{{- $dbHost := include "flows.dbHost" . }}
{{- $runtime := dict
  "FLOWS_ENVIRONMENT" .Values.environment
  "FLOWS_DATABASE_URL" (printf "postgresql+psycopg://flows:__FLOWS_PASSWORD__@%s:5432/flows" $dbHost)
  "FLOWS_JOBS_DATABASE_URL" (printf "postgresql://flows_jobs:__JOBS_PASSWORD__@%s:5432/flows_jobs" $dbHost)
  "FLOWS_AUTH_SECRET" "__AUTH_SECRET__"
  "FLOWS_AUTH_GUEST_ENABLED" "false"
  "FLOWS_API_DOMAIN" .Values.publicURL
  "FLOWS_WEBSITE_DOMAIN" .Values.publicURL
  "FLOWS_STORAGE_PATH" "/data/objects"
  "FLOWS_SECRETS_PATH" "/data/secrets"
  "FLOWS_SCRATCH_PATH" "/scratch"
  "FLOWS_AI_CONFIG_PATH" "/app/config/ai.toml"
  "FLOWS_MODEL_BINDINGS_PATH" "/config/model-bindings.toml"
  "FLOWS_TELEMETRY_INCLUDE_CONTENT" "false"
  "FLOWS_TELEMETRY_DESTINATIONS" "[]"
  "FLOWS_QUALIFIED_ENVIRONMENT_IMAGES" "[]"
  "FLOWS_QUALIFIED_BROWSER_IMAGES" "[]"
}}
{{- range $key, $value := .Values.settings }}
{{- if not (hasPrefix "FLOWS_" $key) }}{{ fail (printf "settings.%s must start with FLOWS_" $key) }}{{ end }}
{{- if not (kindIs "string" $value) }}{{ fail (printf "settings.%s must be a string" $key) }}{{ end }}
{{- if hasKey $runtime $key }}{{ fail (printf "settings.%s is set by the chart" $key) }}{{ end }}
{{- $_ := set $runtime $key $value }}
{{- end }}
{{- /* Helm renders the file; External Secrets fills the Vault values in. */}}
{{- $json := toPrettyJson $runtime
  | replace "__FLOWS_PASSWORD__" "{{ .flows_password }}"
  | replace "__JOBS_PASSWORD__" "{{ .jobs_password }}"
  | replace "__AUTH_SECRET__" "{{ .auth_secret }}" }}
# runtime.json and model-bindings.toml, mounted at /config in every backend pod.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flows-runtime
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: {{ .Values.secretStore.kind }}
    name: {{ .Values.secretStore.name }}
  target:
    name: flows-runtime
    template:
      data:
        runtime.json: |
          {{- $json | nindent 10 }}
        model-bindings.toml: |
          {{- .Values.modelBindings | nindent 10 }}
  data:
    - secretKey: flows_password
      remoteRef: {key: {{ .Values.vault.database }}, property: flows_password}
    - secretKey: jobs_password
      remoteRef: {key: {{ .Values.vault.database }}, property: jobs_password}
    - secretKey: auth_secret
      remoteRef: {key: {{ .Values.vault.auth }}, property: secret}
{{- range $role, $property := dict "flows" "flows_password" "flows_jobs" "jobs_password" }}
---
# Login of the {{ $role }} role, for CloudNativePG.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flows-db-{{ $role | replace "_" "-" }}
  namespace: {{ $.Values.database.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: {{ $.Values.secretStore.kind }}
    name: {{ $.Values.secretStore.name }}
  target:
    name: flows-db-{{ $role | replace "_" "-" }}
    template:
      type: kubernetes.io/basic-auth
      data:
        username: {{ $role }}
        password: "{{ "{{" }} .password {{ "}}" }}"
  data:
    - secretKey: password
      remoteRef: {key: {{ $.Values.vault.database }}, property: {{ $property }}}
{{- end }}
{{- with .Values.imagePullSecret.name }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ . }}
  namespace: {{ $.Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: {{ $.Values.secretStore.kind }}
    name: {{ $.Values.secretStore.name }}
  target:
    name: {{ . }}
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"{{ "{{" }} .server {{ "}}" }}":{"username":"{{ "{{" }} .username {{ "}}" }}","password":"{{ "{{" }} .password {{ "}}" }}"}}}
  data:
    {{- range list "server" "username" "password" }}
    - secretKey: {{ . }}
      remoteRef: {key: {{ $.Values.imagePullSecret.vaultKey }}, property: {{ . }}}
    {{- end }}
{{- end }}
