{{- $ns := printf "int-%s" .Values.name }}
# ESO authenticates to Vault as this service account, whose Vault role reads only this integration's path.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.name }}-vault
  namespace: {{ $ns }}
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: {{ $ns }}
spec:
  provider:
    vault:
      server: {{ .Values.platform.vault.server }}
      path: {{ .Values.platform.vault.path }}
      version: v2
      auth:
        kubernetes:
          mountPath: {{ .Values.platform.vault.authMount }}
          role: {{ $ns }}
          serviceAccountRef:
            name: {{ .Values.name }}-vault
            audiences: [vault]
---
# Every property under integrations/<client>/<name> becomes one file in /var/run/secrets/integration.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.name }}
  namespace: {{ $ns }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: {{ .Values.name }}-secrets
  dataFrom:
    - extract:
        key: integrations/{{ required "platform.client is required" .Values.platform.client }}/{{ .Values.name }}
{{- with .Values.platform.imagePullSecretKey }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: registry-pull
  namespace: {{ $ns }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: registry-pull
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"{{ "{{" }} .server {{ "}}" }}":{"username":"{{ "{{" }} .username {{ "}}" }}","password":"{{ "{{" }} .password {{ "}}" }}"}}}
  data:
    {{- range list "server" "username" "password" }}
    - secretKey: {{ . }}
      remoteRef: {key: {{ $.Values.platform.imagePullSecretKey }}, property: {{ . }}}
    {{- end }}
{{- end }}
