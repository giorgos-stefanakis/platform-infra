# The gateway routes the API paths straight to the API, so the proxy block of the web image's nginx is unused.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: flows
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ .Values.route.gateway.name }}
      namespace: {{ .Values.route.gateway.namespace }}
      sectionName: {{ .Values.route.gateway.sectionName }}
  hostnames: [{{ .Values.route.hostname | quote }}]
  rules:
    - matches:
        {{- range list "/api" "/auth" "/health" "/v1" }}
        - path: {type: PathPrefix, value: {{ . }}}
        {{- end }}
      backendRefs:
        - {name: flows-api, port: 8000}
      # Conversation turns and run streams are long-lived server-sent events.
      timeouts:
        request: 3600s
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs:
        - {name: flows-web, port: 8080}
