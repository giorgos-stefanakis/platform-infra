# Alembic, the Procrastinate schema and the DBOS schema, once per sync, before the workloads (wave 4) start.
# A Sync hook rather than PreSync: on the first install the database is created in this same sync (waves 1-2).
apiVersion: batch/v1
kind: Job
metadata:
  name: flows-migrate
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "3"
spec:
  backoffLimit: 4
  template:
    metadata:
      labels: {app.kubernetes.io/name: flows-migrate}
    spec:
      restartPolicy: Never
      # Service links would add FLOWS_API_PORT and similar, which Flows reads as settings and rejects.
      enableServiceLinks: false
      {{- include "flows.imagePullSecrets" . | nindent 6 }}
      {{- include "flows.podSecurityContext" . | nindent 6 }}
      containers:
        - name: migrate
          image: {{ include "flows.backendImage" . }}
          args: ["migrate"]
          env:
            - {name: FLOWS_EDITION_CONFIG, value: /config/runtime.json}
          {{- include "flows.containerSecurityContext" . | nindent 10 }}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          secret:
            secretName: flows-runtime
            defaultMode: 0440
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 1Gi}
