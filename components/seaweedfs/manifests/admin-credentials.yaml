apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seaweedfs-admin
  namespace: seaweedfs
  annotations:
    # The admin UI reads this Secret at start.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: seaweedfs-admin
  data:
    - secretKey: username
      remoteRef:
        key: object-store-admin
        property: username
    - secretKey: password
      remoteRef:
        key: object-store-admin
        property: password
