apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: key-vault-secret-store
  namespace: argocd
  annotations:
    # Needs the External Secrets Operator CRDs (wave 0).
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
  source:
    repoURL: https://github.com/giorgos-stefanakis/platform-infra.git
    targetRevision: main
    path: clusters/aks/client/secret-store
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
