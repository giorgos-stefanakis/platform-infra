apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: registry-pull
  namespace: argocd
  annotations:
    # Needs the secret store (wave 2). The app pods (wave 4) reference the Secret.
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  source:
    repoURL: {{ .Values.repoURL }}
    targetRevision: {{ .Values.revision }}
    path: components/registry-pull/manifests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
